id: infra/iam-casdoor                # 必须与 component.yaml 一致，be-ops 校验

domain: infra
tier: backend

edge_routes:
  # ⚠️ /.well-known/jwks.json 与 /api/iam/webhooks/casdoor 刻意不出现在
  # 这里——前者只被其他组件的 be-sdk（内网直连）与它们自己的 iamJwksUrl
  # 消费，后者只被 Casdoor 官方容器直连（走 expose 的宿主机端口 + 桥接网关
  # IP，Casdoor 是带外容器、与本组件不在同一个 Docker 网络），两者都不经
  # 公网网关暴露给最终用户浏览器（同 infra-authz 的 /authz/bundle 判据）。
  - { path: /api/iam/token, auth: none }           # 换应用 token，目的就是"从没有身份变成有"
  - { path: /api/iam/token/refresh, auth: none }    # 刷新——凭 refresh token 本身认证，不是会话
  - { path: /api/iam/logout, auth: required }       # 仅需登录（besdk.Authenticated）
  - { path: /api/tenant/features, auth: none }      # 前端启动时、还没登录就要用它决定渲染什么

menus: []                            # 本组件没有面向最终用户的管理界面

data:
  schema: infra_iam_casdoor           # registry/schemas.tsv
  role:   infra_iam_casdoor_rw        # 登录角色，`PG_USER` 的值

data_scopes: none                     # 本组件不存用户表、不存角色，refresh_tokens/
                                       # signing_keys/webhook_deliveries/bootstrap_state 四张表
                                       # 都是纯运维数据，不做行级过滤

permissions: []                       # 本组件的 REST 面全部是 besdk.Public/besdk.Authenticated
                                       # 没有一个对应具体业务权限键——它自己就是
                                       # "还没有身份"与"有身份"之间的那道门，门本身不需要门禁
