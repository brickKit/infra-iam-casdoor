apiVersion: brickkit/v1
kind: Component

metadata:
  id: infra/iam-casdoor
  name: Identity (Casdoor)
  version: 3.0.31
  description: "The identity member in front of Casdoor: browser login with PKCE and a server-side session, short access tokens it signs for the platform principal, its public keys; a development-only password exchange (A101)"
  repository: https://github.com/brickKit/infra-iam-casdoor

deployment:
  type: container
  build:
    context: .
    dockerfile: Dockerfile
  port: 8200
  extraPorts:
    - name: grpc
      port: 9200
      protocol: grpc

healthCheck:
  type: http
  path: /healthz

readinessCheck:
  type: http
  path: /readyz

migration:
  command: ["/infra-iam-casdoor", "migrate"]

local:
  runCommand: [go, run, .]
  migrationCommand: [go, run, ., migrate]

events:
  publishes:
    - be.session.ended.v1
    - infra.iam.account_status_changed.v1

configSchema:
  properties:
    RECOVERY_PHASE:
      description: 'process-level: the same for every member of a shell'
      enum:
        - frozen
        - redelivering
        - replaying
        - verifying
        - read_only
      type: string
    ALERT_WEBHOOK_URL:
      type: string
    RUN_PROFILE_ACCESS_KEY:
      type: string
    RUN_PROFILE_BUCKET:
      type: string
    RUN_PROFILE_REGION:
      description: SDK default us-east-1
      type: string
    RUN_PROFILE_SECRET_KEY:
      secret: true
      type: string
    RUN_PROFILE_URL:
      type: string
    AUDIT_GRPC_URL:
      description: 'process-level: the same for every member of a shell'
      type: string
    AUTHZ_GRPC_URL:
      description: 'process-level: the same for every member of a shell'
      type: string
    BUS_URL:
      description: 'process-level: the same for every member of a shell'
      secret: true
      type: string
    CASDOOR_CLIENT_ID:
      description: the login application's client ID (authorization code)
      type: string
    CASDOOR_CLIENT_SECRET:
      secret: true
      type: string
    CASDOOR_ISSUER:
      description: the iss of Casdoor's ID tokens (its origin setting); default CASDOOR_PUBLIC_URL
      type: string
    CASDOOR_PUBLIC_URL:
      description: Casdoor as the browser reaches it (the login page)
      type: string
    CASDOOR_URL:
      description: Casdoor on the back channel (token exchange, keys), e.g. http://be-casdoor:8000
      type: string
    DEPLOYMENT_ID:
      description: 'process-level: the same for every member of a shell'
      type: string
    IAM_ACCESS_TOKEN_TTL:
      description: a duration (e.g. 2s, 500ms); default 5m (protocol 20); a duration (e.g. 2s, 500ms); SDK default 300s
      type: string
    IAM_AFTER_LOGIN_URL:
      description: where the browser goes after a login without return_to; default /; SDK default /
      type: string
    IAM_CALLBACK_URL:
      description: 'the redirect URI registered for the application in Casdoor: <this member''s public URL>/api/iam/callback'
      type: string
    IAM_COOKIE_SECURE:
      description: the session cookie is Secure; default true (false only for plain-HTTP development); SDK default true
      type: boolean
    IAM_DEV_CLIENT_ID:
      description: the development client with the password grant (IAM_DEV_EXCHANGE)
      type: string
    IAM_DEV_CLIENT_SECRET:
      secret: true
      type: string
    IAM_DEV_EXCHANGE:
      description: 'development and test deployments only (A101): POST /api/iam/dev/token exchanges a user''s password for a token; default false, and the go-live check confirms it is off; SDK default false'
      type: boolean
    IAM_PULL_INTERVAL:
      description: 'a duration (e.g. 2s, 500ms); default 1m: P_pull, how often every bound account is compared with Casdoor (security 03), besides before every echo; a duration (e.g. 2s, 500ms); SDK default 60s'
      type: string
    IAM_T_TIGHT:
      description: 'a duration (e.g. 2s, 500ms); default 1h: T_tight (security 03), beyond which a disablement or freeze decided on a stale view needs a second person; a duration (e.g. 2s, 500ms); SDK default 3600s'
      type: string
    IAM_ISSUER:
      description: 'process-level: the same for every member of a shell'
      type: string
    IAM_JWKS_URL:
      description: 'process-level: the same for every member of a shell'
      type: string
    IAM_SESSION_ABSOLUTE:
      description: a duration (e.g. 2s, 500ms); default 12h (protocol 20); a duration (e.g. 2s, 500ms); SDK default 43200s
      type: string
    IAM_SESSION_IDLE:
      description: a duration (e.g. 2s, 500ms); default 30m (protocol 20); a duration (e.g. 2s, 500ms); SDK default 1800s
      type: string
    IAM_SIGNING_KEY:
      description: 'the current signing key: PEM, Ed25519 (PKCS #8); usually IAM_SIGNING_KEY_FILE, re-read on rotation'
      secret: true
      type: string
    IAM_SIGNING_KEY_NEXT:
      description: the standby key, published in the JWKS before it signs; after a switch, the old key, until its tokens expire
      secret: true
      type: string
    IAM_TOKEN_ISSUER:
      description: the iss of the tokens this member signs; every component's IAM_ISSUER equals it
      type: string
    IMPLEMENTATION_INSTANCE:
      type: string
    LOG_LEVEL:
      description: SDK default info
      enum:
        - debug
        - info
        - warn
        - error
      type: string
    OBJECT_STORE_ACCESS_KEY:
      type: string
    OBJECT_STORE_BUCKET:
      type: string
    OBJECT_STORE_PREFIX:
      type: string
    OBJECT_STORE_REGION:
      description: SDK default us-east-1
      type: string
    OBJECT_STORE_SECRET_KEY:
      secret: true
      type: string
    OBJECT_STORE_URL:
      type: string
    OTEL_URL:
      description: 'process-level: the same for every member of a shell'
      type: string
    PG_DATABASE:
      type: string
    PG_HOST:
      type: string
    PG_IDLE_IN_TX_TIMEOUT:
      description: a duration (e.g. 2s, 500ms); SDK default 10s
      type: string
    PG_LOCK_TIMEOUT:
      description: a duration (e.g. 2s, 500ms); SDK default 2s
      type: string
    PG_MIGRATION_HOST:
      type: string
    PG_MIGRATION_PORT:
      type: integer
    PG_OWNER_PASSWORD:
      secret: true
      type: string
    PG_OWNER_USER:
      type: string
    PG_PASSWORD:
      secret: true
      type: string
    PG_POOL_BACKGROUND:
      description: SDK default 4
      type: integer
    PG_POOL_FOREGROUND:
      description: SDK default 8
      type: integer
    PG_POOLER_PREPARED:
      description: SDK default true
      type: boolean
    PG_PORT:
      description: SDK default 5432
      type: integer
    PG_SCHEMA:
      type: string
    PG_STATEMENT_TIMEOUT:
      description: a duration (e.g. 2s, 500ms); SDK default 5s
      type: string
    PG_USER:
      type: string
    SERVICE_TLS_CA_FILE:
      description: a file path, re-read on rotation
      mount: file
      secret: true
      type: string
    SERVICE_TLS_CERT_FILE:
      description: a file path, re-read on rotation
      mount: file
      secret: true
      type: string
    SERVICE_TLS_KEY_FILE:
      description: a file path, re-read on rotation
      mount: file
      secret: true
      type: string
    STOP_DRAIN_DELAY:
      description: a duration (e.g. 2s, 500ms); SDK default 2s
      type: string
    STOP_TIMEOUT:
      description: a duration (e.g. 2s, 500ms); SDK default 30s
      type: string
  required:
    - BUS_URL
    - CASDOOR_CLIENT_ID
    - CASDOOR_CLIENT_SECRET
    - CASDOOR_PUBLIC_URL
    - CASDOOR_URL
    - IAM_CALLBACK_URL
    - IAM_SIGNING_KEY
    - IAM_TOKEN_ISSUER
    - IMPLEMENTATION_INSTANCE
    - PG_DATABASE
    - PG_HOST
    - PG_PASSWORD
    - PG_SCHEMA
    - PG_USER
  type: object

release:
  goModule: true
