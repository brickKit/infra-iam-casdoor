apiVersion: brickkit/v1
kind: Component

metadata:
  id: infra/iam-casdoor
  name: IAM adapter for Casdoor
  version: 2.0.0
  description: A thin adapter in front of Casdoor; issues and refreshes application tokens, serves /api/tenant/features and bridges Casdoor webhooks.
  repository: https://github.com/brickKit/infra-iam-casdoor
  license: Apache-2.0
  vendor: brickKit

tags: [infra, iam, oidc, slot-iam]

artifacts:
  - type: api-contract
    format: protobuf
    files: [contracts/infra/iam/v1/iam.proto, contracts/events/iam.events.json]
  - type: api-contract
    format: openapi
    files: [contracts/iam.openapi.yaml]
  - type: metadata
    files: [assembly.yaml]

dependencies:
  components: [infra/authz@2.0.1]

configSchema:
  type: object
  properties:
    PG_HOST: {type: string}
    PG_PORT: {type: string, default: "5432"}
    PG_DATABASE: {type: string}
    PG_USER: {type: string}
    PG_PASSWORD: {type: string, secret: true}
    PG_SCHEMA: {type: string, default: infra_iam_casdoor}
    NATS_URL: {type: string}
    OTEL_BASE_URL: {type: string, default: ""}
    IAM_JWKS_URL: {type: string}
    CASDOOR_BASE_URL: {type: string}
    CASDOOR_ADMIN_USERNAME: {type: string, default: admin}
    CASDOOR_ADMIN_PASSWORD: {type: string, secret: true}
    CASDOOR_ORG_NAME: {type: string, default: brickkit}
    CASDOOR_APP_NAME: {type: string, default: brickkit-app}
    WEBHOOK_SHARED_SECRET: {type: string, secret: true}
    WEBHOOK_CALLBACK_URL: {type: string, default: ""}
    APP_TOKEN_SIGNING_KEY_PEM: {type: string, secret: true}
    APP_TOKEN_PREVIOUS_PUBLIC_KEY_PEM: {type: string, default: ""}
    APP_TOKEN_TTL_SECONDS: {type: integer, default: 600}
    REFRESH_TOKEN_TTL_SECONDS: {type: integer, default: 604800}
    ENABLED_COMPONENTS: {type: string}
  required: [PG_HOST, PG_DATABASE, PG_USER, PG_PASSWORD, NATS_URL, IAM_JWKS_URL, CASDOOR_BASE_URL, CASDOOR_ADMIN_PASSWORD, WEBHOOK_SHARED_SECRET, APP_TOKEN_SIGNING_KEY_PEM, ENABLED_COMPONENTS]

deployment:
  type: container
  build: {context: ., dockerfile: Dockerfile}
  port: 8200
  extraPorts:
    - {name: grpc, port: 9200}
  labels:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
  resources:
    requests: {cpu: 150m, memory: 192Mi}

migration:
  command: [./migrate, up]

healthCheck:
  type: http
  path: /healthz

local:
  language: go
  runCommand: [go, run, ./backend/cmd/server]
