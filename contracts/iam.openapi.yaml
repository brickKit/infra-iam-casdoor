openapi: 3.0.3
info:
  title: infra-iam-casdoor · IAM 适配层
  version: 1.0.0
  description: |
    对外 REST 面。⚠️ 与其他组件不同，本组件的路径**不走** `/{domain}/{name}/**`
    前缀——这里的接口是全平台通用的登录/token 机器，从前端视角看与"这是
    哪个组件提供的"无关（同 infra-authz 的 `/api/me/permissions` 判据）。

    ⚠️ 账密校验、MFA、扫码、社交登录**一条都不在这份契约里**——那些是浏览器
    ↔ Casdoor 官方镜像之间的标准 OIDC 流，本组件既不代理也不转发，只在
    "认证成功之后"接手。

# 没有统一 servers 前缀——见上，路径本身已经是最终形态。

# ⚠️ /healthz 不在这份契约里：be-sdk-go 的 NewGinEngine 给每个组件统一挂的，
# 路径固定是裸根路径 /healthz。

paths:
  /api/iam/token:
    post:
      summary: 用 Casdoor 的身份 token 换一个应用 token（登录完成的最后一步）
      description: |
        入参是浏览器与 Casdoor 走完标准 OIDC 流之后拿到的身份 token（只有
        `sub` 等身份字段，不含角色）。本组件验签这个 token（Casdoor 的
        JWKS；`aud` 必须是本组件的 Casdoor 应用或 configSchema 的
        `CASDOOR_EXTRA_CLIENT_IDS` 里列的应用），再调 infra-authz 的 `ResolveClaims` 现问角色/部门/组织，
        最后用自己的私钥签出应用 token（带 `roles[]`/`dept_path`/`org_id`）+
        一个 refresh token。besdk.Public 是必然的——这一步的目的就是把
        "还没有应用身份"变成"有"。
      operationId: exchangeToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [casdoor_id_token]
              properties:
                casdoor_id_token: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400":
          description: 请求体缺 casdoor_id_token
        "401":
          description: Casdoor 身份 token 验签失败、不是签给可信应用的（`aud`），或这个人在 Casdoor 里已停用或删除
        "503":
          description: Casdoor 的验证器还没初始化成功（启动后 Casdoor 尚未可达），还不知道本组件 Casdoor 应用的 client ID（启动对账从没成功过），或 infra-authz 不可达（签发这一步 fail-closed，不用旧的角色签 token）

  /api/iam/token/refresh:
    post:
      summary: 用 refresh token 换一对新的 token
      description: |
        重新调一次 `ResolveClaims`，所以新签出的应用 token 角色天然是最新
        的；refresh token 每次都轮换——这次用掉的 refresh token 立刻失效，
        响应里的才是下次要用的那个。轮换不延长会话：会话在登录后
        `REFRESH_TOKEN_TTL_SECONDS`（configSchema）结束，轮换出的 token 不会晚于
        那一刻过期，之后只能重新登录。
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400":
          description: 请求体缺 refresh_token
        "401":
          description: refresh token 不存在、已撤销或已过期（包括会话已到登录时定下的终点，以及这个人在 Casdoor 里已停用或删除）
        "503":
          description: infra-authz 不可达。这次失败不消耗 refresh token，恢复后用同一个 token 重试即可

  /api/iam/logout:
    post:
      summary: 作废当前 refresh token
      description: 仅需登录（besdk.Authenticated）——任何已验签的应用 token 都能登出自己的 refresh token，不需要具体业务权限键。
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: 已作废（对一个已经作废的 refresh token 重复调用同样返回 200，幂等）
        "400":
          description: 请求体缺 refresh_token
        "401":
          description: 没带应用 token，或应用 token 无效 / 已过期

  /.well-known/jwks.json:
    get:
      summary: 应用 token 的验签公钥
      description: |
        ⚠️ 不经网关暴露，仅内网可达（不在 assembly.yaml 的 edge_routes 里）
        ——各组件的 `IAM_JWKS_URL` 指向这里，不是指向 Casdoor。密钥轮换期间
        会同时挂新旧两把公钥（`kid` 区分）。
      operationId: getJwks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Jwks" }

  /api/tenant/features:
    get:
      summary: 本项目装了哪些组件
      description: |
        数据来源是配置项 `ENABLED_COMPONENTS`，值是项目 `brickkit.yaml` 的内容
        （config 里写 `file://brickkit.yaml`）：取 `components[].id`，跳过外壳
        （`kind: shell`），同一组件的多个版本只算一次，按字典序排列。"装了"不等于
        "在运行"：被部署文件关掉的组件同样在列。besdk.Public 是刻意的：前端还没
        登录就要用它决定渲染什么。
      operationId: getTenantFeatures
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled_components:
                    type: array
                    items: { type: string }

  /api/iam/webhooks/casdoor:
    post:
      summary: Casdoor 的用户增删改事件回调
      description: |
        ⚠️ 不经网关暴露——Casdoor 接进项目网络，按本组件的服务名回调（地址是
        configSchema 的 `WEBHOOK_CALLBACK_URL`）。事件内容不取自投递体：每次投递
        都回 Casdoor 读这个人的当前状态再发 `infra.iam.user.*.v1`，所以投递的
        到达顺序不影响下游最后的值。Casdoor 从不重发投递，所以这里只登记、
        回读与发事件由后台的投递队列做：Casdoor 此刻读不读得到都回 200，
        读不到时投递在队列里等。besdk.Public 指的是"不走权限键"，不是"不
        校验"——真正的校验是比对 `X-Shared-Secret`（或 Casdoor webhook
        配置里那个自定义 header 名，见 configSchema 的 `WEBHOOK_SHARED_SECRET`）
        是不是配置的共享密钥。**漏了这条校验就等于开了一个任何人都能
        伪造用户事件的口子**。
      operationId: casdoorWebhook
      security:
        - sharedSecretHeader: []
      responses:
        "200":
          description: 已登记（去重；不代表事件已经发出——用户变更由后台队列回读 Casdoor 后经 Outbox 发布）
        "401":
          description: 共享密钥校验失败
        "503":
          description: 本组件不再返回这个状态，保留声明只因契约只增。读不回 Casdoor（管理会话还没就绪、Casdoor 不可达或出错）时投递照样登记、回 200，在队列里等 Casdoor 回来；登记本身失败（数据库不可用）回 500

components:
  securitySchemes:
    sharedSecretHeader:
      type: apiKey
      in: header
      name: X-Shared-Secret

  schemas:
    TokenPair:
      type: object
      properties:
        access_token:  { type: string, description: "应用 token（JWT），TTL 见 configSchema 的 APP_TOKEN_TTL_SECONDS" }
        refresh_token: { type: string }
        token_type:    { type: string, enum: [Bearer] }
        expires_in:    { type: integer, description: "秒" }

    Jwks:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
            description: 标准 JWK（RFC 7517），字段含 kty/use/alg/kid/n/e
